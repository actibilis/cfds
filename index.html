<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xin AI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --primary: #00f5ff;
            --accent: #ff00ff;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #1a0033);
            color: #e0e0ff;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: rgba(15, 15, 35, 0.85);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }
        .logo {
            padding: 0 24px 20px;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 245, 255, 0.5);
        }
        .new-chat {
            margin: 0 16px 24px;
            padding: 14px 20px;
            background: linear-gradient(90deg, #00f5ff, #ff00ff);
            color: #000;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(0, 245, 255, 0.3);
        }
        .new-chat:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(0, 245, 255, 0.5); }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px;
        }
        .chat-item {
            padding: 12px 20px;
            margin: 4px 0;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-item:hover, .chat-item.active {
            background: rgba(255,255,255,0.08);
        }

        /* Main area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .header {
            height: 70px;
            background: rgba(10, 10, 30, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            padding: 0 32px;
            font-size: 18px;
            font-weight: 600;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            background: radial-gradient(circle at center, rgba(0,245,255,0.03), transparent);
        }

        .message {
            max-width: 75%;
            padding: 16px 22px;
            border-radius: 22px;
            line-height: 1.55;
            font-size: 15.5px;
            position: relative;
            animation: messagePop 0.4s ease;
        }
        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #00f5ff, #0099ff);
            color: #000;
            border-bottom-right-radius: 4px;
        }
        .ai-message {
            align-self: flex-start;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-bottom-left-radius: 4px;
        }

        /* 3D Avatar */
        .ai-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00f5ff, #ff00ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 40px rgba(0, 245, 255, 0.6);
            transform-style: preserve-3d;
        }

        .input-area {
            padding: 24px 32px;
            background: rgba(10, 10, 30, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .input-wrapper {
            display: flex;
            background: rgba(255,255,255,0.06);
            border-radius: 30px;
            padding: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 16px;
            padding: 14px 24px;
            resize: none;
            max-height: 160px;
        }
        .send-btn {
            width: 52px;
            height: 52px;
            background: linear-gradient(45deg, #00f5ff, #ff00ff);
            border: none;
            border-radius: 50%;
            color: #000;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .send-btn:hover { transform: scale(1.1) rotate(12deg); }

        @keyframes messagePop {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .typing {
            display: flex;
            gap: 6px;
            padding: 16px 22px;
            background: rgba(255,255,255,0.06);
            border-radius: 22px;
            width: fit-content;
        }
        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00f5ff;
            border-radius: 50%;
            animation: typingBounce 1.2s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">Xin</div>
        <button class="new-chat" id="newChatBtn">＋ Новый разговор</button>
        <div class="chat-list" id="chatList"></div>
    </div>

    <!-- Main -->
    <div class="main">
        <div class="header">
            <div style="display:flex;align-items:center;gap:12px;">
                <div class="ai-avatar" id="mainAvatar">✦</div>
                <div>
                    <div style="font-weight:600;">Xin</div>
                    <div style="font-size:13px;opacity:0.7;">всегда онлайн • локальная модель</div>
                </div>
            </div>
        </div>

        <div class="chat-container" id="chatContainer"></div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="Напиши Xin..."></textarea>
                <button class="send-btn" id="sendBtn">↑</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://xnsre-185-59-246-10.a.free.pinggy.link/v1';
        const API_KEY = 'sk-lm-hhTsuHgi:McBjzMim30tt6KOp8O1o';
        const STORAGE_KEY = 'xin_chats';

        let chats = {};
        let currentChatId = null;
        let isWaiting = false;

        // Элементы
        const chatContainer = document.getElementById('chatContainer');
        const chatList = document.getElementById('chatList');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const newChatBtn = document.getElementById('newChatBtn');

        // 3D tilt для аватарки
        VanillaTilt.init(document.getElementById('mainAvatar'), {
            max: 25,
            speed: 400,
            glare: true,
            "max-glare": 0.5
        });

        function loadChats() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) chats = JSON.parse(saved);
            renderChatList();
            if (Object.keys(chats).length === 0) createNewChat();
            else switchChat(Object.keys(chats)[Object.keys(chats).length-1]);
        }

        function saveChats() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
        }

        function renderChatList() {
            chatList.innerHTML = '';
            Object.keys(chats).forEach(id => {
                const item = document.createElement('div');
                item.className = `chat-item ${id === currentChatId ? 'active' : ''}`;
                item.innerHTML = `<span>${chats[id].title}</span>`;
                item.onclick = () => switchChat(id);
                chatList.appendChild(item);
            });
        }

        function createNewChat() {
            const id = Date.now().toString();
            const title = "Новый разговор " + new Date().toLocaleDateString('ru-RU', {month:'short', day:'numeric'});
            chats[id] = { title, messages: [] };
            saveChats();
            renderChatList();
            switchChat(id);
        }

        function switchChat(id) {
            currentChatId = id;
            renderChatList();
            chatContainer.innerHTML = '';
            chats[id].messages.forEach(m => addMessage(m.role, m.content));
        }

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role === 'user' ? 'user-message' : 'ai-message'}`;
            div.innerHTML = `<div>${content.replace(/\n/g, '<br>')}</div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            if (isWaiting || !currentChatId) return;
            const text = userInput.value.trim();
            if (!text) return;

            const chat = chats[currentChatId];
            chat.messages.push({ role: 'user', content: text });
            addMessage('user', text);
            saveChats();
            userInput.value = '';
            isWaiting = true;

            // Typing indicator
            const typing = document.createElement('div');
            typing.className = 'typing';
            typing.innerHTML = '<span></span><span></span><span></span>';
            chatContainer.appendChild(typing);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const res = await fetch(`${API_BASE}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`,
                        'X-Pinggy-No-Screen': 'true'
                    },
                    body: JSON.stringify({
                        model: 'local-model',
                        messages: chat.messages,
                        temperature: 0.85,
                        max_tokens: 2048
                    })
                });

                if (!res.ok) throw new Error('Ошибка соединения');

                const data = await res.json();
                const reply = data.choices[0].message.content;
                chat.messages.push({ role: 'assistant', content: reply });
                typing.remove();
                addMessage('assistant', reply);
                saveChats();
            } catch (e) {
                typing.remove();
                addMessage('assistant', '✦ Xin не смог ответить... Проверь туннель.');
            }
            isWaiting = false;
        }

        // События
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        newChatBtn.addEventListener('click', createNewChat);

        // Авто-фокус и старт
        loadChats();
        userInput.focus();
    </script>
</body>
</html>
