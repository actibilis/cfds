<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Локальный AI Чат (LM Studio + Pinggy)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { font-size: 1.2rem; font-weight: 500; }
        .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .select-chat, .model-input, .api-key-input {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .select-chat { width: 160px; }
        .model-input { width: 140px; }
        .api-key-input { width: 260px; }
        .btn { 
            background: white; border: none; color: #2c3e50; padding: 6px 14px;
            border-radius: 20px; font-size: 0.9rem; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { background: #f0f0f0; }
        .chat-container {
            flex: 1; overflow-y: auto; padding: 16px; display: flex;
            flex-direction: column; gap: 12px; background: #e5ddd5;
        }
        .message {
            max-width: 85%; padding: 10px 14px; border-radius: 18px;
            word-wrap: break-word; line-height: 1.4; font-size: 1rem;
            position: relative; animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .user-message { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 4px; }
        .ai-message { align-self: flex-start; background: white; border-bottom-left-radius: 4px; }
        .error-message { align-self: center; background: #ffebee; color: #c62828; border-radius: 12px; font-size: 0.9rem; text-align: center; }
        .timestamp { font-size: 0.7rem; color: #888; margin-top: 4px; text-align: right; }
        .input-area {
            background: white; padding: 10px 12px; display: flex; gap: 8px;
            border-top: 1px solid #ddd; flex-shrink: 0; align-items: flex-end;
        }
        textarea {
            flex: 1; border: 1px solid #ccc; border-radius: 24px; padding: 12px 16px;
            font-size: 1rem; resize: none; max-height: 120px; outline: none; background: #fafafa;
        }
        textarea:focus { border-color: #2c3e50; }
        .send-btn {
            background: #2c3e50; color: white; border: none; border-radius: 50%;
            width: 48px; height: 48px; font-size: 1.4rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .send-btn:disabled { background: #b0bec5; cursor: not-allowed; }
        .status { font-size: 0.8rem; color: #666; text-align: center; padding: 4px; }
        @media (max-width: 480px) {
            .header { flex-direction: column; gap: 8px; }
            .controls { justify-content: space-between; width: 100%; }
            .api-key-input { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 Локальный AI (Pinggy + LM Studio)</h1>
        <div class="controls">
            <select id="chatSelect" class="select-chat">
                <option value="">Выберите чат...</option>
            </select>
            <button class="btn" id="newChatBtn">+ Новый чат</button>
            <input type="text" id="modelName" class="model-input" placeholder="Модель" value="local-model">
            <input type="text" id="apiKey" class="api-key-input" placeholder="API Key (LM Studio)" value="sk-lm-hhTsuHgi:McBjzMim30tt6KOp8O1o">
        </div>
    </div>
    <div id="chatContainer" class="chat-container"></div>
    <div class="input-area">
        <textarea id="userInput" placeholder="Введите сообщение..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn" title="Отправить" disabled>➤</button>
    </div>
    <div id="statusMessage" class="status">Загрузка чатов...</div>

    <script>
        (function() {
            // Конфигурация
            const API_BASE = 'const API_BASE = 'https://ugeen-185-59-246-10.a.free.pinggy.link/v1';  // твой текущий Pinggy туннель
            const STORAGE_KEY = 'ai_chats_v2';  // обновлённый ключ, чтобы не конфликтовать со старыми данными

            // Элементы DOM
            const chatSelect = document.getElementById('chatSelect');
            const newChatBtn = document.getElementById('newChatBtn');
            const chatContainer = document.getElementById('chatContainer');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const modelInput = document.getElementById('modelName');
            const apiKeyInput = document.getElementById('apiKey');
            const statusDiv = document.getElementById('statusMessage');

            // Состояние
            let chats = {};          // { chatId: { title: "...", messages: [...] } }
            let currentChatId = null;
            let isWaiting = false;

            // Загрузка сохранённых чатов
            function loadChats() {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        chats = JSON.parse(saved);
                    } catch (e) {
                        console.warn("Повреждённые данные в localStorage, начинаем заново");
                        chats = {};
                    }
                }
                updateChatSelect();
                statusDiv.textContent = '';

                if (Object.keys(chats).length > 0) {
                    const ids = Object.keys(chats);
                    switchChat(ids[ids.length - 1]);  // последний чат
                } else {
                    createNewChat();  // если ничего нет — создаём первый
                }
            }

            // Сохранение
            function saveChats() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
            }

            // Обновление списка чатов
            function updateChatSelect() {
                chatSelect.innerHTML = '<option value="">Выберите чат...</option>';
                Object.keys(chats).forEach(id => {
                    const opt = document.createElement('option');
                    opt.value = id;
                    opt.textContent = chats[id].title || `Чат ${id.slice(0,8)}`;
                    chatSelect.appendChild(opt);
                });
            }

            // Переключение на другой чат
            function switchChat(chatId) {
                if (!chats[chatId]) return;
                currentChatId = chatId;
                chatSelect.value = chatId;
                renderMessages(chats[chatId].messages);
                userInput.focus();
                statusDiv.textContent = `Открыт: ${chats[chatId].title || 'Без названия'}`;
            }

            // Отрисовка сообщений
            function renderMessages(messages) {
                chatContainer.innerHTML = '';
                messages.forEach(msg => {
                    addMessageToUI(msg.role, msg.content, msg.role === 'system' && msg.isError);
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            function addMessageToUI(role, content, isError = false) {
                const div = document.createElement('div');
                div.classList.add('message');
                if (role === 'user') div.classList.add('user-message');
                else if (role === 'assistant') div.classList.add('ai-message');
                else if (isError) div.classList.add('error-message');

                const text = document.createElement('div');
                text.textContent = content;
                div.appendChild(text);

                const time = document.createElement('div');
                time.classList.add('timestamp');
                time.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                div.appendChild(time);

                chatContainer.appendChild(div);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            // Новый чат
            function createNewChat() {
                const id = Date.now().toString();
                const title = prompt('Название нового чата (можно пропустить):') || `Чат ${new Date().toLocaleDateString()}`;
                chats[id] = { title, messages: [] };
                saveChats();
                updateChatSelect();
                switchChat(id);
                addMessageToUI('system', 'Новый диалог начат. Пиши!', false);
                chats[id].messages.push({ role: 'system', content: 'Новый диалог начат.' });
                saveChats();
            }

            // Отправка запроса
            async function sendRequest() {
                if (isWaiting || !currentChatId) return;
                const text = userInput.value.trim();
                if (!text) return;

                const currentChat = chats[currentChatId];
                currentChat.messages.push({ role: 'user', content: text });
                addMessageToUI('user', text);
                saveChats();

                userInput.value = '';
                userInput.style.height = 'auto';
                isWaiting = true;
                sendBtn.disabled = true;
                statusDiv.textContent = 'AI думает...';

                try {
                    const headers = { 'Content-Type': 'application/json' };
                    const key = apiKeyInput.value.trim();
                    if (key) {
                        headers['Authorization'] = `Bearer ${key}`;
                    }

                    const res = await fetch(`${API_BASE}/chat/completions`, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({
                            model: modelInput.value.trim() || 'local-model',
                            messages: currentChat.messages,
                            temperature: 0.7,
                            max_tokens: 2000,
                            stream: false
                        })
                    });

                    if (!res.ok) {
                        let errMsg = `Ошибка ${res.status}`;
                        if (res.status === 401 || res.status === 403) {
                            errMsg += ': Неверный API Key или Basic Auth Pinggy';
                        }
                        const errText = await res.text().catch(() => '');
                        throw new Error(errMsg + (errText ? `: ${errText}` : ''));
                    }

                    const data = await res.json();
                    const aiText = data.choices[0].message.content.trim();
                    currentChat.messages.push({ role: 'assistant', content: aiText });
                    addMessageToUI('assistant', aiText);
                    saveChats();
                } catch (err) {
                    console.error(err);
                    const msg = err.message.includes('Failed to fetch') 
                        ? 'Нет соединения. Проверь, запущен ли туннель Pinggy и LM Studio.'
                        : err.message;
                    addMessageToUI('system', `❌ ${msg}`, true);
                    statusDiv.textContent = 'Ошибка';
                } finally {
                    isWaiting = false;
                    sendBtn.disabled = false;
                    statusDiv.textContent = '';
                }
            }

            // Авто-высота поля ввода
            userInput.addEventListener('input', () => {
                userInput.style.height = 'auto';
                userInput.style.height = userInput.scrollHeight + 'px';
            });

            // Enter = отправка
            userInput.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendRequest();
                }
            });

            sendBtn.addEventListener('click', sendRequest);
            newChatBtn.addEventListener('click', createNewChat);
            chatSelect.addEventListener('change', e => {
                if (e.target.value) switchChat(e.target.value);
            });

            // Старт
            loadChats();
            sendBtn.disabled = false;
            userInput.focus();
        })();
    </script>
</body>
</html>
